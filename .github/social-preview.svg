<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="50%" stop-color="#AF52DE"/>
      <stop offset="100%" stop-color="#FF2D55"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="50%" stop-color="#5856D6"/>
      <stop offset="100%" stop-color="#AF52DE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Dot grid pattern -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.5" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Gradient orbs -->
  <circle cx="200" cy="150" r="250" fill="#007AFF" opacity="0.06" filter="url(#soft-glow)"/>
  <circle cx="1080" cy="500" r="220" fill="#FF2D55" opacity="0.05" filter="url(#soft-glow)"/>
  <circle cx="640" cy="320" r="180" fill="#AF52DE" opacity="0.04" filter="url(#soft-glow)"/>

  <!-- Top gradient line -->
  <rect x="340" y="0" width="600" height="1" fill="url(#accent)" opacity="0.4"/>

  <!-- Logo icon -->
  <g transform="translate(564, 140)">
    <rect width="56" height="56" rx="14" fill="url(#logo-grad)" filter="url(#glow)"/>
    <path d="M36 16L22 34h10v10l14-18H36z" fill="white" opacity="0.95"/>
  </g>

  <!-- Title -->
  <text x="640" y="260" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="white">
    Micro-interaction Lab
  </text>

  <!-- Subtitle EN -->
  <text x="640" y="310" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#9CA3AF" letter-spacing="0.5">
    Apple-style Motion Design  ·  60fps Silk-smooth  ·  Security Hardened
  </text>

  <!-- Subtitle CN -->
  <text x="640" y="345" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#6B7280" letter-spacing="1">
    探索动画边界 · 提升交互愉悦感 · 6层纵深安全防护
  </text>

  <!-- Feature pills -->
  <g transform="translate(640, 400)" text-anchor="middle">
    <!-- Pill: Buttons -->
    <g transform="translate(-320, 0)">
      <rect x="-52" y="-16" width="104" height="32" rx="16" fill="rgba(0,122,255,0.15)" stroke="rgba(0,122,255,0.3)" stroke-width="1"/>
      <text y="5" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#007AFF" text-anchor="middle">Buttons</text>
    </g>
    <!-- Pill: Cards -->
    <g transform="translate(-180, 0)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="rgba(175,82,222,0.15)" stroke="rgba(175,82,222,0.3)" stroke-width="1"/>
      <text y="5" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#AF52DE" text-anchor="middle">Cards</text>
    </g>
    <!-- Pill: Inputs -->
    <g transform="translate(-60, 0)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="rgba(52,199,89,0.15)" stroke="rgba(52,199,89,0.3)" stroke-width="1"/>
      <text y="5" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#34C759" text-anchor="middle">Inputs</text>
    </g>
    <!-- Pill: Loaders -->
    <g transform="translate(60, 0)">
      <rect x="-46" y="-16" width="92" height="32" rx="16" fill="rgba(255,149,0,0.15)" stroke="rgba(255,149,0,0.3)" stroke-width="1"/>
      <text y="5" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF9500" text-anchor="middle">Loaders</text>
    </g>
    <!-- Pill: Security -->
    <g transform="translate(180, 0)">
      <rect x="-50" y="-16" width="100" height="32" rx="16" fill="rgba(255,45,85,0.15)" stroke="rgba(255,45,85,0.3)" stroke-width="1"/>
      <text y="5" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF2D55" text-anchor="middle">Security</text>
    </g>
    <!-- Pill: i18n -->
    <g transform="translate(300, 0)">
      <rect x="-36" y="-16" width="72" height="32" rx="16" fill="rgba(90,200,250,0.15)" stroke="rgba(90,200,250,0.3)" stroke-width="1"/>
      <text y="5" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#5AC8FA" text-anchor="middle">i18n</text>
    </g>
  </g>

  <!-- Tech stack row -->
  <g transform="translate(640, 470)" text-anchor="middle">
    <text y="0" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#4B5563" letter-spacing="2">
      HONO  ·  CLOUDFLARE PAGES  ·  TYPESCRIPT  ·  TAILWIND CSS  ·  VITE
    </text>
  </g>

  <!-- Gradient divider -->
  <rect x="340" y="510" width="600" height="1" fill="url(#accent)" opacity="0.15"/>

  <!-- Bottom stats -->
  <g transform="translate(640, 555)" text-anchor="middle">
    <!-- 6 Layers -->
    <g transform="translate(-200, 0)">
      <text y="-8" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="white">6</text>
      <text y="14" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280" letter-spacing="1">SECURITY LAYERS</text>
    </g>
    <!-- 20+ Components -->
    <g transform="translate(0, 0)">
      <text y="-8" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="white">20+</text>
      <text y="14" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280" letter-spacing="1">COMPONENTS</text>
    </g>
    <!-- 2K Lines -->
    <g transform="translate(200, 0)">
      <text y="-8" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="white">2K+</text>
      <text y="14" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280" letter-spacing="1">LINES OF CODE</text>
    </g>
  </g>

  <!-- Bottom gradient line -->
  <rect x="340" y="639" width="600" height="1" fill="url(#accent)" opacity="0.3"/>

  <!-- Version badge -->
  <g transform="translate(1200, 40)">
    <rect x="-40" y="-12" width="80" height="24" rx="12" fill="rgba(0,122,255,0.2)" stroke="rgba(0,122,255,0.4)" stroke-width="1"/>
    <text y="5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#007AFF">v3.0.0</text>
  </g>
</svg>
